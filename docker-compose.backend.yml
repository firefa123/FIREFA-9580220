services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-firefa}
      POSTGRES_USER: ${POSTGRES_USER:-firefa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or root .env file}
    volumes:
      - firefa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-firefa} -d ${POSTGRES_DB:-firefa}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-firefa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-firefa}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 random characters}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?Set BOOTSTRAP_TOKEN to at least 32 random characters}
      PLATFORM_ADMIN_BOOTSTRAP_TOKEN: ${PLATFORM_ADMIN_BOOTSTRAP_TOKEN:?Set PLATFORM_ADMIN_BOOTSTRAP_TOKEN to at least 32 random characters}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:migrate && npm start"]
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"

volumes:
  firefa_postgres_data: