name: Backend validation

on:
  push:
    branches: [main, development]
    paths:
      - "backend/**"
      - "docker-compose.backend.yml"
      - ".github/workflows/backend-validation.yml"
  pull_request:
    branches: [main, development]
    paths:
      - "backend/**"
      - "docker-compose.backend.yml"
      - ".github/workflows/backend-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Backend typecheck, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build