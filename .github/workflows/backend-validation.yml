name: Backend validation

on:
  push:
    branches: [main, development]
    paths:
      - "backend/**"
      - "docker-compose.backend.yml"
      - ".github/workflows/backend-validation.yml"
  pull_request:
    branches: [main, development]
    paths:
      - "backend/**"
      - "docker-compose.backend.yml"
      - ".github/workflows/backend-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Backend typecheck, tests, migration, and readiness
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: firefa_ci
          POSTGRES_USER: firefa_ci
          POSTGRES_PASSWORD: firefa_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U firefa_ci -d firefa_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://firefa_ci:firefa_ci_password@localhost:5432/firefa_ci
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Apply PostgreSQL migrations
        run: npm run db:migrate
      - name: Verify migrations are idempotent
        run: npm run db:migrate
      - name: Verify schema tables exist
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DO \\$\$ BEGIN IF to_regclass('public.tenants') IS NULL OR to_regclass('public.outlets') IS NULL OR to_regclass('public.users') IS NULL OR to_regclass('public.orders') IS NULL OR to_regclass('public.sync_receipts') IS NULL OR to_regclass('public.order_events') IS NULL THEN RAISE EXCEPTION 'Required FIREFA tables are missing'; END IF; END \\$\$;"
      - name: Verify API readiness against PostgreSQL
        run: |
          node dist/server.js > /tmp/firefa-backend.log 2>&1 &
          echo $! > /tmp/firefa-backend.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health/ready; then
              echo
              exit 0
            fi
            sleep 1
          done
          cat /tmp/firefa-backend.log
          exit 1