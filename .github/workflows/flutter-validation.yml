name: Flutter validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
    branches: [main, development]
  push:
    branches: [main, development, 'validation/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - apps/firefa_main_app
          - apps/firefa_staff_app
    name: Validate ${{ matrix.app }}
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --reporter expanded
      - name: Build Web
        run: flutter build web --release

  validate-web-portals:
    name: Validate Customer Web and Super Admin portals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate portal files and inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = [
            'apps/firefa_customer_web/index.html',
            'apps/firefa_main_app/web/customer/index.html',
            'apps/firefa_super_admin/index.html'
          ];
          for (const file of files) {
            if (!fs.existsSync(file)) throw new Error('Missing web entrypoint: ' + file);
            const html = fs.readFileSync(file, 'utf8');
            if (!/<html[\s>]/i.test(html) || !/<body[\s>]/i.test(html)) {
              throw new Error('Invalid HTML entrypoint: ' + file);
            }
            for (const match of html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)) {
              if (match[1].trim()) {
                try { new Function(match[1]); }
                catch (error) { throw new Error('JavaScript syntax error in ' + file + ': ' + error.message); }
              }
            }
            console.log('Validated ' + file);
          }
          const portal = fs.readFileSync('apps/firefa_super_admin/index.html', 'utf8');
          for (const path of ['/auth/bootstrap','/auth/login','/overview','/tenants','/outlets','/audit-logs','/sync-status','/status']) {
            if (!portal.includes(path)) throw new Error('Super Admin portal missing API path ' + path);
          }
          NODE
